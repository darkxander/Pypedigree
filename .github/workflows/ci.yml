name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "latest"
      - run: uv sync --extra dev --extra pandas
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - name: Type-check (the package ships py.typed)
        run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "latest"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra pandas
      - run: uv run pytest --cov=pypedigree --cov-report=xml
      - name: Upload visual regression diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            tests/visual/golden/*.actual.png
            tests/visual/golden/*.diff.png
          if-no-files-found: ignore
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  test-minimum-versions:
    # The lower bounds in pyproject.toml are a promise to users; install
    # exactly those versions on the oldest supported Python and run the suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "latest"
      - run: uv venv -p 3.10
      - run: uv pip install --resolution lowest-direct -e ".[pandas]" "pytest>=7"
      - run: .venv/bin/python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, test-minimum-versions]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "latest"
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
